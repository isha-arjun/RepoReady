name: RepoReady Quality Checks

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  basic-checks:
    name: Verify essential files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f preview.html
          test -f README.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f SECURITY.md
          test -f .github/workflows/quality.yml
          echo "All essential files are present."

      - name: Check HTML file is not empty
        run: |
          test -s preview.html
          echo "preview.html exists and is not empty."

      - name: Check documentation files are not empty
        run: |
          test -s README.md
          test -s CONTRIBUTING.md
          test -s CODE_OF_CONDUCT.md
          test -s SECURITY.md
          echo "Documentation files are present and non-empty."
